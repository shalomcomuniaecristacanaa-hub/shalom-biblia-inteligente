name: Build and publish plugin
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "release/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: shalom-plugin-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and package
        run: npm run package
      - name: Publish compiled files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist release
          if ! git diff --cached --quiet; then
            git commit -m "build: publish compiled plugin"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after fetch/rebase."
            done
            echo "Could not publish build artifacts after 3 attempts."
            exit 1
          fi
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shalom-biblia-inteligente-installer
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
