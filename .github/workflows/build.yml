name: Build and publish plugin
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "release/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and package
        run: npm run package
      - name: Publish compiled files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist release
          if ! git diff --cached --quiet; then
            git commit -m "build: publish compiled plugin"
            git push
          fi
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shalom-biblia-inteligente-installer
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
