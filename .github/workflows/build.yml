name: Build and publish plugin
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "release/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: shalom-plugin-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build and publish latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Build/publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            npm run package

            git add dist release
            if git diff --cached --quiet; then
              echo "Compiled artifacts are already up to date."
              exit 0
            fi

            git commit -m "build: publish compiled plugin"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main changed during build; retrying from newest main."
          done

          echo "Could not publish compiled files after 3 fresh builds."
          exit 1
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v5
        with:
          name: shalom-biblia-inteligente-installer
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
